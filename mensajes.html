<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mensajes para Danna | Mis 15 Años</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet"><style>

<main class="messages-page"><div class="page-title"><div class="aves" aria-hidden="true"><svg viewBox="0 0 140 100"><use href="#ave"/></svg><svg class="fl" viewBox="-30 -30 60 60" aria-hidden="true"><use href="#flor"/></svg><svg class="flip" viewBox="0 0 140 100"><use href="#ave"/></svg></div><small>Palabras para recordar</small><h1>Mensajes para Danna</h1><p>Déjale a Danna unas palabras para recordar este momento tan especial.</p></div>

<button class="btn" id="sendMessageButton">Dejar mi mensaje</button><div id="messageStatus" class="message-status"></div></div>
<div class="messages-title"><div class="div" aria-hidden="true"><i></i><svg class="fl" viewBox="-30 -30 60 60" aria-hidden="true"><use href="#flor"/></svg><i></i></div><small>Recuerdos escritos</small><h2>Mensajes recibidos</h2></div>

<footer class="footer"><svg class="fl" viewBox="-30 -30 60 60" aria-hidden="true"><use href="#flor"/></svg>Danna Valentina Garzón Medina · Mis quince años</footer><script>


    /* ============================================
       SUPABASE
       ============================================ */

    const SUPABASE_URL =
      "https://utkqspswdjamfmhzalov.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_rBWSVkYl3T_ai_0ZQ6Av1A_jTgXR_59";


    /* ============================================
       ELEMENTOS
       ============================================ */

    const messageName =
      document.getElementById(
        "messageName"
      );


    const messageText =
      document.getElementById(
        "messageText"
      );


    const sendMessageButton =
      document.getElementById(
        "sendMessageButton"
      );


    const messagesContainer =
      document.getElementById(
        "messagesContainer"
      );


    const messageStatus =
      document.getElementById(
        "messageStatus"
      );


    /* ============================================
       CARGAR MENSAJES
       ============================================ */

    async function loadMessages() {

      try {

        const response =
          await fetch(
            `${SUPABASE_URL}/rest/v1/mensajes?select=nombre,mensaje,created_at&order=created_at.desc`,
            {
              headers: {

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  `Bearer ${SUPABASE_KEY}`

              }
            }
          );


        if (!response.ok) {

          throw new Error(
            "No se pudieron cargar los mensajes."
          );

        }


        const messages =
          await response.json();


        messagesContainer.innerHTML =
          "";


        if (
          messages.length === 0
        ) {

          messagesContainer.innerHTML =
            `<div class="empty">
              Todavía no hay mensajes. Sé el primero en dejar uno ✉
            </div>`;

          return;

        }


        messages.forEach(
          message => {

            const card =
              document.createElement(
                "div"
              );


            card.className =
              "message-card";


            const name =
              document.createElement(
                "strong"
              );


            name.textContent =
              `❦ ${message.nombre}`;


            const text =
              document.createElement(
                "p"
              );


            text.textContent =
              message.mensaje;


            card.appendChild(
              name
            );


            card.appendChild(
              text
            );


            messagesContainer.appendChild(
              card
            );

          }
        );


      } catch (error) {

        console.error(
          error
        );


        messagesContainer.innerHTML =
          `<div class="empty">
            No se pudieron cargar los mensajes.
          </div>`;

      }

    }


    /* ============================================
       ENVIAR MENSAJE
       ============================================ */

    sendMessageButton.addEventListener(
      "click",
      async () => {

        const nombre =
          messageName.value.trim();


        const mensaje =
          messageText.value.trim();


        if (
          !nombre ||
          !mensaje
        ) {

          messageStatus.textContent =
            "Por favor escribe tu nombre y tu mensaje ❦";

          return;

        }


        sendMessageButton.disabled =
          true;


        sendMessageButton.textContent =
          "Enviando...";


        messageStatus.textContent =
          "";


        try {

          const response =
            await fetch(
              `${SUPABASE_URL}/rest/v1/mensajes`,
              {
                method: "POST",

                headers: {

                  "Content-Type":
                    "application/json",

                  "apikey":
                    SUPABASE_KEY,

                  "Authorization":
                    `Bearer ${SUPABASE_KEY}`,

                  "Prefer":
                    "return=minimal"

                },

                body:
                  JSON.stringify({

                    nombre:
                      nombre,

                    mensaje:
                      mensaje

                  })

              }
            );


          if (
            !response.ok
          ) {

            throw new Error(
              "No se pudo enviar el mensaje."
            );

          }


          messageName.value =
            "";


          messageText.value =
            "";


          messageStatus.textContent =
            "✦ ¡Tu mensaje fue enviado!";


          await loadMessages();


        } catch (error) {

          console.error(
            error
          );


          messageStatus.textContent =
            "No se pudo enviar el mensaje. Intenta nuevamente.";

        }


        sendMessageButton.disabled =
          false;


        sendMessageButton.textContent =
          "✉ Dejar mi mensaje";

      }
    );
