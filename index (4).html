<script>
const welcomeScreen=document.getElementById("welcomeScreen");
const enterButton=document.getElementById("enterButton");
const albumButton=document.getElementById("albumButton");
const sobre=document.getElementById("sobre");
const cartaInt=document.getElementById("cartaInt");
const musica=document.getElementById("musica");
let abierto=false;
cartaInt.inert=true;

/* Invitación personalizada: index.html?para=Tía%20Marta */
try{
  const para=(new URLSearchParams(location.search).get("para")||"").trim().slice(0,40);
  if(para){
    document.getElementById("firmaSobre").textContent="Para "+para;
    cartaInt.querySelector(".inv").textContent=para+", pasa a ver el álbum de recuerdos y comparte tus fotos.";
    try{localStorage.setItem("danna15_nombre",para);}catch(e){}
  }
}catch(e){}

/* Mide el sobre y la carta para que quepan en cualquier pantalla */
function medir(){
  const r=sobre.getBoundingClientRect(),eh=r.height,lh=cartaInt.offsetHeight;
  let s0=Math.min(0.9*eh/lh,(0.17*eh+r.top-10)/lh,0.65);
  s0=Math.max(0.3,s0);
  cartaInt.style.setProperty("--s0",s0.toFixed(3));
  cartaInt.style.setProperty("--rise",(-eh*(0.97-0.5625*(1-0.88*s0)))+"px");
  cartaInt.style.setProperty("--dy",(lh/2-0.45*eh)+"px");
}
medir();
window.addEventListener("resize",()=>{if(!abierto)medir();});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!abierto)medir();});

/* Cuando la carta ya está en su lugar, aparece el mensaje y el botón */
(function(){
  let t=5.2;
  const p=cartaInt.querySelector(".inv"),txt=p.textContent.trim();
  p.setAttribute("aria-label",txt);p.textContent="";
  txt.split(" ").forEach((w,i,a)=>{
    const s=document.createElement("span");
    s.className="rv";s.setAttribute("aria-hidden","true");
    s.textContent=w+(i<a.length-1?" ":"");
    s.style.setProperty("--d",t.toFixed(2)+"s");
    p.appendChild(s);t+=0.09;
  });
  t+=0.3;
  albumButton.classList.add("bk");albumButton.style.setProperty("--d",t.toFixed(2)+"s");
})();

/* Romper el sello: se abre la solapa y la carta sale del sobre */
enterButton.addEventListener("click",()=>{
  if(abierto)return;
  abierto=true;
  musica.play().catch(()=>{});
  medir();
  cartaInt.inert=false;
  welcomeScreen.classList.add("opening");
});
document.getElementById("saltar").addEventListener("click",()=>{
  welcomeScreen.classList.add("listo");
});

/* Entrar al álbum (index.html) */
albumButton.addEventListener("click",()=>{
  try{
    sessionStorage.setItem("invitacionVista","1");
    sessionStorage.setItem("musicaActiva",musica.paused?"0":"1");
    sessionStorage.setItem("musicaTiempo",String(musica.currentTime));
  }catch(e){}
  welcomeScreen.classList.add("hidden");
  setTimeout(()=>{location.href="inicio.html";},800);
});
</script></body></html>
